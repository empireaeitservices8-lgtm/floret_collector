name: Test Workflow

on:
  workflow_dispatch:
    inputs:
      test_input:
        description: 'Test Input'
        required: true
        default: 'Hello'
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Echo
        run: echo "Hello ${{ inputs.test_input }}"
